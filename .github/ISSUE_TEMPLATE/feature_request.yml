name: Feature request
description: An idea for something Kestello should do.
title: 'feat: '
labels: ['type: feature', 'status: needs triage']
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: Who runs into it (a site owner, an editor, a developer), and what they have to do today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How Kestello could solve it. Screens, API calls or code examples help.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other ways to solve it, including a plugin. Why aren't they enough?
  - type: checkboxes
    id: contribute
    attributes:
      label: Helping
      options:
        - label: I'd like to work on this myself.
