# Weekly updates for the development tools (nothing here ships) and the workflows' actions.
# Pull requests target develop, as every change does. Composer only has require-dev
# (PHPStan and PHP CS Fixer): Kestello requires nothing at runtime.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: build(deps)
    labels: ['type: chore', 'no changelog']
    groups:
      lint:
        patterns: ['eslint*', '@eslint/*', 'globals', 'prettier']
      build:
        patterns: ['vite', '@vitejs/*', 'vue']
  - package-ecosystem: composer
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: build(deps)
    labels: ['type: chore', 'no changelog']
    groups:
      php-tools:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: ci(deps)
    labels: ['type: chore', 'no changelog']
